server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: iams-iasvc-termsearch-svc
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    probes:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

termsearch:
  enabled: true
  datasource:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev,sit,uat,lpt,prd
  datasource:
    url: ${ORACLE_URL:}
    username: ${ORACLE_USERNAME:iams_app_cld_rw_user}
    password: ${ORACLE_PASSWORD:}
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      connection-pool-name: IamsTermsearchUCP
      fast-connection-failover-enabled: true
      validate-connection-on-borrow: true
      sql-for-validate-connection: SELECT 1 FROM DUAL
      initial-pool-size: 1
      min-pool-size: 1
      max-pool-size: 10

termsearch:
  datasource:
    enabled: true
